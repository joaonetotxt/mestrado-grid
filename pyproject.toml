[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mestrado-grid"
version = "0.1.0"
description = "Planejamento de redes de distribuicao com dez metodos de otimizacao e avaliacao AC"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{name = "João Ferreira da Silva Neto"}]
dependencies = ["numpy==1.26.0", "scipy==1.16.3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mestrado-grid = "mestrado_grid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mestrado_grid"]
namespaces = false

[tool.setuptools.package-data]
mestrado_grid = ["_vendor/**/*.py", "_vendor/**/*.json"]
